[package]
name = "corinzia-audio"
description = "Corinzia's audio engine: CLAP hosting, realtime rendering of performed scores, PipeWire output"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clap-sys = "0.5"
libloading = "0.8"
rtrb = "0.3"
vst3 = "0.3"
corinzia-score.workspace = true
corinzia-model.workspace = true
corinzia-perform.workspace = true
corinzia-sine.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.8", optional = true }
libc = "0.2"
x11rb = "0.13"

[target.'cfg(windows)'.dependencies]
cpal = { version = "0.16", optional = true }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["pipewire", "wasapi"]
# Live output through PipeWire on Linux (needs libpipewire; bindgen at build time).
pipewire = ["dep:pipewire"]
# Live output through WASAPI on Windows.
wasapi = ["dep:cpal"]
