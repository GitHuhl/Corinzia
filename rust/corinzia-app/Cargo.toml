[package]
name = "corinzia-app"
description = "Corinzia: music notation editor and CLAP DAW (iced)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "corinzia"
path = "src/main.rs"

[dependencies]
corinzia-score.workspace = true
corinzia-model.workspace = true
corinzia-edit.workspace = true
corinzia-perform.workspace = true
corinzia-audio.workspace = true
corinzia-import.workspace = true
corinzia-layout = { workspace = true, features = ["pdf"] }
iced = { version = "0.14", features = ["canvas", "advanced"] }
ttf-parser = "0.25"
png = "0.17"
serde.workspace = true
serde_json.workspace = true
rfd = "0.15"

[features]
default = ["audio-out"]
# Live output: PipeWire on Linux, WASAPI on Windows.
audio-out = ["corinzia-audio/pipewire", "corinzia-audio/wasapi"]
# A self-contained build for the AppImage: SQLite compiled in.
portable = ["corinzia-model/bundled-sqlite"]
