[workspace]
resolver = "2"
members = ["corinzia-score", "corinzia-model", "corinzia-export", "corinzia-layout", "corinzia-ffi", "corinzia-edit", "corinzia-perform", "corinzia-sine", "corinzia-audio", "corinzia-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
corinzia-score = { path = "corinzia-score" }
corinzia-export = { path = "corinzia-export" }
corinzia-model = { path = "corinzia-model" }
corinzia-edit = { path = "corinzia-edit" }
corinzia-perform = { path = "corinzia-perform" }
corinzia-sine = { path = "corinzia-sine" }
corinzia-audio = { path = "corinzia-audio" }
corinzia-layout = { path = "corinzia-layout", default-features = false }
