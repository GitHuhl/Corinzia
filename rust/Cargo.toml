[workspace]
resolver = "2"
members = ["corinzia-score", "corinzia-model", "corinzia-export", "corinzia-import", "corinzia-layout", "corinzia-edit", "corinzia-byz", "corinzia-perform", "corinzia-ensemble", "corinzia-audio", "corinzia-app"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
corinzia-score = { path = "corinzia-score" }
corinzia-export = { path = "corinzia-export" }
corinzia-import = { path = "corinzia-import" }
corinzia-model = { path = "corinzia-model" }
corinzia-edit = { path = "corinzia-edit" }
corinzia-byz = { path = "corinzia-byz" }
corinzia-perform = { path = "corinzia-perform" }
corinzia-ensemble = { path = "corinzia-ensemble" }
corinzia-audio = { path = "corinzia-audio", default-features = false }
corinzia-layout = { path = "corinzia-layout", default-features = false }

# The audio path renders in real time: unoptimised, the built-in
# instruments and the engine miss their deadlines (clicks and dropouts in
# playback). Optimised even in development builds; the rest stays quick to
# build.
[profile.dev.package.corinzia-ensemble]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.corinzia-audio]
opt-level = 3
