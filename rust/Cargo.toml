[workspace]
resolver = "2"
members = ["corinzia-score", "corinzia-export", "corinzia-layout"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
corinzia-score = { path = "corinzia-score" }
