[workspace]
resolver = "2"
members = ["corinzia-score", "corinzia-model", "corinzia-export", "corinzia-layout", "corinzia-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
corinzia-score = { path = "corinzia-score" }
corinzia-export = { path = "corinzia-export" }
corinzia-model = { path = "corinzia-model" }
corinzia-layout = { path = "corinzia-layout", default-features = false }
