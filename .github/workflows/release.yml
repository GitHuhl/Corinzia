# Builds the Linux AppImage and the Windows zip with Nix and publishes them
# as a GitHub release.
#
# A push to main publishes release v<version> (the workspace version in
# rust/Cargo.toml, which flake.nix reads too) if there is none yet: bump
# the version to make a new release. Pushing a v* tag publishes that tag. "Run workflow" builds
# without publishing (the files are kept as a workflow artifact).
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decide the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            tag="${GITHUB_REF_NAME}"; publish=true
          else
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -n1)
            tag="v${version}"; publish=false
            if [ "${GITHUB_EVENT_NAME}" = push ] && ! gh release view "$tag" >/dev/null 2>&1; then
              publish=true
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "release $tag, publish: $publish"
      - uses: cachix/install-nix-action@v31
        if: steps.release.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
      - name: Build the AppImage and the Windows zip
        if: steps.release.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          tag="${{ steps.release.outputs.tag }}"
          nix build .#appimage -L -o appimage
          cp appimage/Corinzia-x86_64.AppImage "Corinzia-${tag}-x86_64.AppImage"
          nix build .#windows -L -o windows
          cp windows/Corinzia-x86_64-windows.zip "Corinzia-${tag}-x86_64-windows.zip"
          sha256sum Corinzia-*.AppImage Corinzia-*.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        with:
          name: corinzia
          path: |
            Corinzia-*.AppImage
            Corinzia-*.zip
            SHA256SUMS
      - name: Publish the release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Corinzia ${{ steps.release.outputs.tag }}
          files: |
            Corinzia-*.AppImage
            Corinzia-*.zip
            SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ startsWith(steps.release.outputs.tag, 'v0.') }}
